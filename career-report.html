<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>你的职场诊断报告</title>
<meta name="description" content="25道题系统诊断你的职场状态，5种类型+7模块结构化报告。你是燃烧殆尽型还是温水煮蛙型？来测测看👉">
<style>
/* ============================================================
   全局样式 & 设计系统
   ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #2D3748;
  --primary-dark: #1A202C;
  --accent: #E53E3E;
  --bg: #F7F5F0;
  --card-bg: #ffffff;
  --text-primary: #1A202C;
  --text-secondary: #4A5568;
  --text-light: #A0AEC0;
  --border: #E2E8F0;
  --shadow: 0 2px 16px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.10);
  --radius: 14px;
  --radius-sm: 10px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  min-height: 100dvh;
  padding: 0;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

#app { width: 100%; max-width: 480px; margin: 0 auto; }

/* Animations */
@keyframes fadeSlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes bounceIn { 0% { transform: scale(0.3); opacity: 0; } 50% { transform: scale(1.05); } 70% { transform: scale(0.9); } 100% { transform: scale(1); opacity: 1; } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
@keyframes fillBar { from { width: 0%; } }
@keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }

/* ============================================================
   通用卡片
   ============================================================ */
.card, .report-card {
  background: var(--card-bg);
  margin: 0 12px 12px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  animation: fadeSlideUp 0.5s ease;
  overflow: hidden;
}
.card { padding: 32px 24px; text-align: center; }
.report-card { padding: 24px 20px; text-align: left; }

/* ============================================================
   开场页
   ============================================================ */
.splash-header {
  background: var(--card-bg);
  margin: 0 12px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 32px 24px;
  text-align: center;
  margin-top: 24px;
}
.splash-emoji { font-size: 56px; margin-bottom: 12px; animation: bounceIn 0.8s ease; display: inline-block; }
.splash-title { font-size: 22px; font-weight: 800; color: var(--text-primary); margin-bottom: 6px; }
.splash-subtitle { font-size: 13px; color: var(--text-secondary); margin-bottom: 3px; }
.splash-desc { font-size: 12px; color: var(--text-light); margin-bottom: 20px; line-height: 1.6; }
.divider { width: 36px; height: 2px; background: var(--primary); border-radius: 1px; margin: 12px auto; opacity: 0.4; }
.q-tag { display: inline-block; padding: 3px 14px; background: rgba(45,55,72,0.06); color: var(--primary); border-radius: 20px; font-size: 11px; font-weight: 600; margin-bottom: 14px; }
.btn-start { display: inline-block; padding: 13px 44px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; border: none; border-radius: 50px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all var(--transition); box-shadow: 0 4px 16px rgba(0,0,0,0.15); letter-spacing: 0.5px; }
.btn-start:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
.btn-start:active { transform: scale(0.96); }
.disclaimer-small { font-size: 10px; color: var(--text-light); margin-top: 14px; opacity: 0.6; }

/* ============================================================
   答题页
   ============================================================ */
.progress-wrap { width: 100%; height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 20px; overflow: hidden; }
.progress-bar { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); border-radius: 2px; transition: width 0.4s ease; }
.question-counter { font-size: 11px; color: var(--primary); font-weight: 700; margin-bottom: 6px; }
.question-text { font-size: 18px; font-weight: 700; color: var(--text-primary); margin-bottom: 24px; line-height: 1.5; }
.options-list { display: flex; flex-direction: column; gap: 9px; }
.option-btn { display: block; width: 100%; padding: 14px 16px; background: #F9FAFB; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; color: var(--text-primary); cursor: pointer; transition: all var(--transition); text-align: left; font-family: inherit; }
.option-btn:hover { border-color: var(--primary); background: rgba(45,55,72,0.02); transform: translateX(3px); }
.option-btn:active { transform: scale(0.98); }
.option-btn.selected { border-color: var(--primary); background: rgba(45,55,72,0.04); color: var(--primary); font-weight: 600; }
.option-btn .option-letter { display: inline-block; width: 24px; height: 24px; line-height: 24px; text-align: center; background: var(--border); border-radius: 50%; margin-right: 10px; font-size: 11px; font-weight: 700; color: var(--text-secondary); transition: all var(--transition); }
.option-btn.selected .option-letter { background: var(--primary); color: #fff; }
.btn-next { display: none; width: 100%; padding: 13px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; border: none; border-radius: 50px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 20px; transition: all var(--transition); box-shadow: 0 4px 14px rgba(0,0,0,0.12); }
.btn-next.visible { display: block; animation: fadeSlideUp 0.3s ease; }
.btn-next:hover { transform: translateY(-2px); }

/* ============================================================
   计算动画
   ============================================================ */
.calculating { text-align: center; padding: 40px 20px; }
.calc-emoji { font-size: 40px; animation: pulse 1s infinite; }
.calc-text { font-size: 14px; color: var(--text-secondary); margin-top: 12px; }
.calc-dots { display: flex; gap: 4px; justify-content: center; margin-top: 10px; }
.calc-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); animation: pulse 1.2s infinite; opacity: 0.3; }
.calc-dots span:nth-child(2) { animation-delay: 0.2s; }
.calc-dots span:nth-child(3) { animation-delay: 0.4s; }

/* ============================================================
   模块一：诊断报告卡
   ============================================================ */
.diagnosis-header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.diagnosis-header .diag-icon { font-size: 20px; }
.diagnosis-header h3 { font-size: 15px; font-weight: 700; color: var(--text-primary); }
.diag-row { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
.diag-row:last-child { border-bottom: none; }
.diag-label { width: 80px; font-size: 13px; color: var(--text-light); flex-shrink: 0; }
.diag-value { font-size: 14px; font-weight: 700; color: var(--text-primary); }
.diag-value.risk-high { color: var(--accent); }
.diag-value.risk-mid { color: #DD6B20; }
.diag-value.risk-low { color: #38A169; }
.score-divider { width: 100%; height: 1px; background: var(--border); margin: 4px 0; }

/* ============================================================
   模块二：6维进度条（替代雷达图）
   ============================================================ */
.dimensions-list { margin-top: 12px; }
.dim-item { display: flex; align-items: center; margin-bottom: 14px; }
.dim-item:last-child { margin-bottom: 0; }
.dim-name { width: 70px; font-size: 12px; color: var(--text-secondary); flex-shrink: 0; text-align: right; margin-right: 12px; }
.dim-bar-wrap { flex: 1; height: 8px; background: #EDF2F7; border-radius: 4px; overflow: hidden; position: relative; }
.dim-bar-fill { height: 100%; border-radius: 4px; transition: width 1s ease 0.3s; }
.dim-score { width: 36px; font-size: 12px; font-weight: 700; color: var(--text-primary); text-align: right; margin-left: 8px; }

/* ============================================================
   模块三：深度分析
   ============================================================ */
.analysis-block { margin-bottom: 18px; }
.analysis-block:last-child { margin-bottom: 0; }
.analysis-label { font-size: 13px; font-weight: 700; color: var(--text-primary); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.analysis-label .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.dot-green { background: #38A169; }
.dot-red { background: var(--accent); }
.dot-blue { background: #3182CE; }
.analysis-text { font-size: 13px; color: var(--text-secondary); line-height: 1.7; }
.warning-box { background: #FFF5F5; border-left: 3px solid var(--accent); padding: 10px 14px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; margin: 8px 0; }
.warning-box p { font-size: 13px; color: #C53030; line-height: 1.6; }
.blind-card { background: #F7FAFC; border-radius: var(--radius-sm); padding: 14px; margin-bottom: 10px; border: 1px solid var(--border); }
.blind-card:last-child { margin-bottom: 0; }
.blind-card-title { font-size: 13px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
.blind-card-text { font-size: 12px; color: var(--text-secondary); line-height: 1.7; }

/* ============================================================
   模块四：未来推演
   ============================================================ */
.projection-warn { background: #FFF5F5; border-radius: var(--radius-sm); padding: 14px; margin-bottom: 14px; }
.projection-warn h4 { font-size: 13px; color: var(--accent); margin-bottom: 8px; }
.projection-warn .warn-item { font-size: 12px; color: var(--text-secondary); margin-bottom: 5px; padding-left: 12px; position: relative; }
.projection-warn .warn-item::before { content: '⚠'; position: absolute; left: -2px; font-size: 11px; }
.compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.compare-col { border-radius: var(--radius-sm); padding: 14px; }
.compare-col.bad { background: #FFF5F5; border: 1px solid #FED7D7; }
.compare-col.good { background: #F0FFF4; border: 1px solid #C6F6D5; }
.compare-col h4 { font-size: 12px; font-weight: 700; margin-bottom: 8px; }
.compare-col.bad h4 { color: var(--accent); }
.compare-col.good h4 { color: #38A169; }
.compare-col p { font-size: 11px; color: var(--text-secondary); margin-bottom: 3px; line-height: 1.6; }

/* ============================================================
   模块五：问题来源
   ============================================================ */
.source-bars { margin: 8px 0 14px; }
.source-item { display: flex; align-items: center; margin-bottom: 10px; }
.source-name { width: 68px; font-size: 12px; color: var(--text-secondary); flex-shrink: 0; }
.source-bar-wrap { flex: 1; height: 10px; background: #EDF2F7; border-radius: 5px; overflow: hidden; margin: 0 10px; }
.source-bar-fill { height: 100%; border-radius: 5px; transition: width 1s ease 0.5s; }
.source-pct { width: 36px; font-size: 12px; font-weight: 700; color: var(--text-primary); text-align: right; }
.core-type-box { background: linear-gradient(135deg, #1A202C, #2D3748); color: #fff; border-radius: var(--radius-sm); padding: 18px; text-align: center; margin-top: 4px; }
.core-type-name { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
.core-type-quote { font-size: 14px; opacity: 0.9; line-height: 1.7; margin-bottom: 6px; }
.core-type-insight { font-size: 12px; opacity: 0.7; line-height: 1.6; font-style: italic; }

/* ============================================================
   模块六：行动路线图（时间线）
   ============================================================ */
.timeline { position: relative; padding-left: 28px; margin-top: 10px; }
.timeline::before { content: ''; position: absolute; left: 8px; top: 6px; bottom: 6px; width: 2px; background: var(--border); }
.timeline-item { position: relative; margin-bottom: 18px; animation: slideIn 0.5s ease forwards; opacity: 0; }
.timeline-item:nth-child(2) { animation-delay: 0.2s; }
.timeline-item:nth-child(3) { animation-delay: 0.4s; }
.timeline-item:nth-child(4) { animation-delay: 0.6s; }
.timeline-dot { position: absolute; left: -28px; top: 4px; width: 16px; height: 16px; border-radius: 50%; background: var(--primary); border: 3px solid #fff; box-shadow: 0 0 0 2px var(--primary); }
.timeline-week { font-size: 11px; color: var(--primary); font-weight: 700; margin-bottom: 2px; }
.timeline-title { font-size: 14px; font-weight: 700; color: var(--text-primary); margin-bottom: 3px; }
.timeline-action { font-size: 12px; color: var(--text-secondary); line-height: 1.6; }

/* ============================================================
   模块七：治愈收尾
   ============================================================ */
.report-end { text-align: center; padding: 32px 24px; background: var(--card-bg); margin: 0 12px 24px; border-radius: var(--radius); box-shadow: var(--shadow); }
.report-end h2 { font-size: 18px; font-weight: 800; color: var(--text-primary); margin-bottom: 12px; }
.report-end .ending-line { font-size: 14px; color: var(--text-secondary); line-height: 2; }
.report-end .ending-line em { color: var(--accent); font-style: normal; }
.btn-retry { display: inline-block; padding: 12px 36px; background: var(--card-bg); color: var(--primary); border: 2px solid var(--border); border-radius: 50px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 16px; transition: all var(--transition); font-family: inherit; }
.btn-retry:hover { background: #F7FAFC; border-color: var(--primary); }

/* ============================================================
   报告标题区
   ============================================================ */
.report-hero { text-align: center; padding: 28px 24px 20px; background: var(--card-bg); margin: 0 12px 12px; border-radius: var(--radius); box-shadow: var(--shadow); }
.report-hero .hero-emoji { font-size: 48px; animation: bounceIn 0.6s ease; }
.report-hero .hero-subtitle { font-size: 12px; color: var(--text-light); margin-top: 4px; }

/* ============================================================
   屏幕切换
   ============================================================ */
.screen { display: none; }
.screen.active { display: block; }

/* Toast */
.toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-120px); background: #1A202C; color: #fff; padding: 10px 22px; border-radius: 50px; font-size: 13px; font-weight: 600; z-index: 999; transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 6px 20px rgba(0,0,0,0.2); }
.toast.show { transform: translateX(-50%) translateY(0); }

/* Responsive */
@media (max-width: 380px) {
  .card, .report-card { padding: 20px 16px; }
  .splash-header { padding: 24px 16px; }
  .splash-title { font-size: 19px; }
  .question-text { font-size: 16px; }
  .report-hero { padding: 22px 16px 16px; }
  .diag-label { width: 65px; font-size: 11px; }
  .dim-name { width: 58px; font-size: 11px; }
  .source-name { width: 56px; font-size: 11px; }
}
</style>
</head>
<body>

<div id="app">
  <!-- ============================================================
       开场页
       ============================================================ -->
  <div id="screen-splash" class="screen active">
    <div class="splash-header">
      <div class="splash-emoji" id="splashEmoji">📊</div>
      <h1 class="splash-title" id="splashTitle">测试标题</h1>
      <p class="splash-subtitle" id="splashSubtitle"></p>
      <div class="divider"></div>
      <p class="splash-desc" id="splashDesc"></p>
      <div class="q-tag" id="qCountTag"></div>
      <br>
      <button class="btn-start" onclick="startTest()">✨ 开始测试</button>
      <p class="disclaimer-small">纯趣味测试，非科学评估 · 仅供娱乐</p>
    </div>
  </div>

  <!-- ============================================================
       答题页
       ============================================================ -->
  <div id="screen-question" class="screen">
    <div class="card">
      <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
      <div class="question-counter" id="questionCounter">1 / 8</div>
      <h2 class="question-text" id="questionText"></h2>
      <div class="options-list" id="optionsList"></div>
      <button class="btn-next" id="btnNext" onclick="nextQuestion()">下一题 →</button>
    </div>
  </div>

  <!-- ============================================================
       计算中
       ============================================================ -->
  <div id="screen-calculating" class="screen">
    <div class="card">
      <div class="calculating">
        <div class="calc-emoji">🔬</div>
        <p class="calc-text">正在生成你的专属诊断报告…</p>
        <div class="calc-dots"><span></span><span></span><span></span></div>
      </div>
    </div>
  </div>

  <!-- ============================================================
       报告结果页（7大模块）
       ============================================================ -->
  <div id="screen-result" class="screen">
    <div id="report-root"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ################################################################
// 🎨 测试配置区
// ################################################################
const TEST_CONFIG = {
  title: '你的职场诊断报告',
  subtitle: '25道题 · 全面诊断你的职业生涯状态',
  description: '你的职场状态健康吗？是燃烧殆尽还是温水煮蛙？25道题，系统诊断你的职业生命周期，给你一份专属的职场诊断报告。',
  emoji: '📊',
  themeColor: '#2D3748',
  accentColor: '#E53E3E',

  questions: [
    { text: '周一早上闹钟响了，你的第一反应是？',
      options: [
        { text: '立刻起床，新的一周冲！', score: 4 },
        { text: '还行，正常起床准备上班', score: 3 },
        { text: '再睡5分钟...艰难爬起来', score: 2 },
        { text: '想请假，不想面对', score: 1 } ] },
    { text: '你对现在工作的感受最接近？',
      options: [
        { text: '充满激情，每天都有新挑战', score: 4 },
        { text: '还可以，偶尔有成就感', score: 3 },
        { text: '就那样，每天重复差不多的事', score: 2 },
        { text: '毫无感觉，纯粹为了工资', score: 1 } ] },
    { text: '下班后的状态是？',
      options: [
        { text: '还有精力学习/运动/社交', score: 4 },
        { text: '有点累，但还能做点自己的事', score: 3 },
        { text: '精疲力尽，瘫在沙发上刷手机', score: 2 },
        { text: '连刷手机的力气都没有', score: 1 } ] },
    { text: '你多久没有过"今天真开心"的感觉了？',
      options: [
        { text: '经常有，昨天就有', score: 4 },
        { text: '一周总有那么一两次', score: 3 },
        { text: '上个月好像有过...', score: 2 },
        { text: '想不起来了', score: 1 } ] },
    { text: '周末你会主动想工作的事吗？',
      options: [
        { text: '会，因为真的喜欢', score: 4 },
        { text: '偶尔想到，但不焦虑', score: 3 },
        { text: '会想，带着隐隐的烦躁', score: 2 },
        { text: '绝对不想，一想到就难受', score: 1 } ] },
    { text: '你感觉自己在成长吗？',
      options: [
        { text: '是的，每个月都能感到进步', score: 4 },
        { text: '有成长，但速度慢下来了', score: 3 },
        { text: '很久没学到新东西了', score: 2 },
        { text: '不但没成长，感觉在退步', score: 1 } ] },
    { text: '同事聚餐时聊到工作，你？',
      options: [
        { text: '有很多有趣的事情可以分享', score: 4 },
        { text: '能参与讨论，有自己看法', score: 3 },
        { text: '基本沉默，没什么想说的', score: 2 },
        { text: '想吐槽，但忍住了', score: 1 } ] },
    { text: '你上一次认真思考"我到底想做什么"是什么时候？',
      options: [
        { text: '不需要思考，我很清楚', score: 4 },
        { text: '最近有想过，方向明确', score: 3 },
        { text: '想过，但没有答案', score: 2 },
        { text: '不敢想，想了会慌', score: 1 } ] },
    { text: '工作压力让你出现过哪些身体信号？',
      options: [
        { text: '没什么影响，身体很好', score: 4 },
        { text: '偶尔失眠或头疼', score: 3 },
        { text: '经常失眠/胃疼/肩颈僵硬', score: 2 },
        { text: '出现了明显的健康问题', score: 1 } ] },
    { text: '你的朋友圈/社交圈里聊工作的频率？',
      options: [
        { text: '经常聊，有丰富的职场话题', score: 4 },
        { text: '偶尔聊到，比较正常', score: 3 },
        { text: '几乎不提工作相关', score: 2 },
        { text: '朋友们都说我总是吐槽工作', score: 1 } ] },
    { text: '你愿意为现在的工作付出额外努力吗？',
      options: [
        { text: '愿意，因为能看到价值和回报', score: 4 },
        { text: '重要的事会多付出一些', score: 3 },
        { text: '不太愿意，付出和回报不成比例', score: 2 },
        { text: '完全不愿意，能少做就少做', score: 1 } ] },
    { text: '你对公司/行业的未来有信心吗？',
      options: [
        { text: '非常有信心，前景光明', score: 4 },
        { text: '谨慎乐观，应该没问题', score: 3 },
        { text: '不太乐观，但还能待', score: 2 },
        { text: '完全没信心，感觉在沉船', score: 1 } ] },
    { text: '你觉得自己在职场的核心竞争力是？',
      options: [

// ################################################################
// ⚙️ 测试引擎
// ################################################################
let currentQuestion = 0;
let scores = [];

function initConfig() {
  const cfg = TEST_CONFIG;
  document.title = cfg.title;
  document.querySelector('meta[name="description"]').content = cfg.description || cfg.title;
  const root = document.documentElement;
  root.style.setProperty('--primary', cfg.themeColor);
  root.style.setProperty('--accent', cfg.accentColor);
  root.style.setProperty('--primary-dark', adjustColor(cfg.themeColor, -15));
  
  document.getElementById('splashEmoji').textContent = cfg.emoji || '📊';
  document.getElementById('splashTitle').textContent = cfg.title;
  document.getElementById('splashSubtitle').textContent = cfg.subtitle || '';
  document.getElementById('splashDesc').textContent = cfg.description || '';
  document.getElementById('qCountTag').textContent = `共 ${cfg.questions.length} 题 · 约2分钟`;
}

function adjustColor(hex, amount) {
  const num = parseInt(hex.replace('#', ''), 16);
  const r = Math.max(0, Math.min(255, ((num >> 16) & 0xFF) + amount));
  const g = Math.max(0, Math.min(255, ((num >> 8) & 0xFF) + amount));
  const b = Math.max(0, Math.min(255, (num & 0xFF) + amount));
  return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, '0')}`;
}

function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + screenId).classList.add('active');
}

function startTest() {
  currentQuestion = 0; scores = [];
  showScreen('question'); renderQuestion();
}

function renderQuestion() {
  const cfg = TEST_CONFIG;
  const q = cfg.questions[currentQuestion];
  const total = cfg.questions.length;
  document.getElementById('progressBar').style.width = ((currentQuestion) / total * 100) + '%';
  document.getElementById('questionCounter').textContent = `${currentQuestion + 1} / ${total}`;
  document.getElementById('questionText').textContent = q.text;
  document.getElementById('optionsList').innerHTML = q.options.map((opt, i) => {
    const letter = String.fromCharCode(65 + i);
    return `<button class="option-btn" onclick="selectOption(${i}, this)" data-index="${i}"><span class="option-letter">${letter}</span>${opt.text}</button>`;
  }).join('');
  document.getElementById('btnNext').classList.remove('visible');
  const card = document.querySelector('#screen-question .card');
  card.style.animation = 'none'; card.offsetHeight; card.style.animation = 'fadeSlideUp 0.4s ease';
}

function selectOption(index, btn) {
  const q = TEST_CONFIG.questions[currentQuestion];
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  scores[currentQuestion] = q.options[index].score;
  const nextBtn = document.getElementById('btnNext');
  nextBtn.classList.add('visible');
  nextBtn.textContent = currentQuestion < TEST_CONFIG.questions.length - 1 ? '下一题 →' : '查看诊断报告 ✨';
}

function nextQuestion() {
  if (scores[currentQuestion] === undefined) { showToast('请先选择一个选项哦~'); return; }
  currentQuestion++;
  if (currentQuestion < TEST_CONFIG.questions.length) { renderQuestion(); } else { showResult(); }
}

function showResult() {
  const cfg = TEST_CONFIG;
  const totalScore = scores.reduce((a, b) => a + b, 0);
  let r = cfg.results[0];
  for (const res of cfg.results) { if (totalScore >= res.range[0] && totalScore <= res.range[1]) { r = res; break; } }
  
  showScreen('calculating');
  setTimeout(() => {
    showScreen('result');
    renderReport(r);
  }, 1500);
}

// ################################################################
// 📋 报告渲染引擎
// ################################################################

      <div class="diag-row"><span class="diag-label">风险等级</span><span class="diag-value ${riskClass}">${D.risk}</span></div>
      <div class="diag-row"><span class="diag-label">核心问题</span><span class="diag-value">${D.core}</span></div>
      <div class="diag-row"><span class="diag-label">次级问题</span><span class="diag-value">${D.secondary}</span></div>

      <div class="diagnosis-header"><span class="diag-icon">📊</span><h3>职业状态总览</h3></div>

        ${dimNames.map((name, i) => `
          <div class="dim-item">
            <span class="dim-name">${name}</span>
            <div class="dim-bar-wrap"><div class="dim-bar-fill" style="width:0%;background:${dimColors[i]}" data-w="${dimValues[i]}"></div></div>
            <span class="dim-score">${dimValues[i]}</span>
          </div>

      </div>
    </div>

    <!-- 模块三：深度分析 -->

      <div class="analysis-block">
        <div class="analysis-label"><span class="dot dot-green"></span>你的隐藏优势</div>
        <div class="analysis-text">${R.analysis.hiddenStrength}</div>

      <div class="analysis-block">
        <div class="analysis-label"><span class="dot dot-red"></span>你现在最不该做什么</div>

      </div>
      <div class="analysis-block">
        <div class="analysis-label"><span class="dot dot-blue"></span>你的三个盲区</div>
        ${R.analysis.blindSpots.map((b, i) => `
          <div class="blind-card">
            <div class="blind-card-title">盲区${i+1}：${b.title}</div>
            <div class="blind-card-text">${b.text}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <!-- 模块四：未来推演 -->
    <div class="report-card">
      <div class="diagnosis-header"><span class="diag-icon">⚠️</span><h3>如果什么都不改变，6个月后</h3></div>
      <div class="projection-warn">
        <h4>📉 预警信号</h4>
        ${R.projection.warning ? Object.entries(R.projection.warning).map(([k,v]) => 
          `<div class="warn-item"><strong>${k}：</strong>${v}</div>`
        ).join('') : `<div class="warn-item">${R.projection.warnSummary || '状态持续下滑，问题将进一步恶化'}</div>`}
      </div>
      ${R.projection.keepStatus ? `
      <div class="compare-grid">
        <div class="compare-col bad">
          <h4>🚫 保持现状</h4>
          ${R.projection.keepStatus.map(s => `<p>${s}</p>`).join('')}
        </div>
        <div class="compare-col good">
          <h4>✅ 开始调整</h4>
          ${R.projection.startAdjust.map(s => `<p>${s}</p>`).join('')}
        </div>
      </div>` : ''}
    </div>

    <!-- 模块五：问题来源 -->
    <div class="report-card">
      <div class="diagnosis-header"><span class="diag-icon">🎯</span><h3>你的问题来源</h3></div>
      <div class="source-bars">
        ${R.source.dimensions.map((d, i) => {
          const sColors = ['#2B6CB0', '#38A169', '#DD6B20', '#E53E3E'];
          return `
          <div class="source-item">
            <span class="source-name">${d.name}</span>
            <div class="source-bar-wrap"><div class="source-bar-fill" style="width:0%;background:${sColors[i]||'#2D3748'}" data-w="${d.pct}"></div></div>
            <span class="source-pct">${d.pct}%</span>

    <div class="report-card">
      <div class="diagnosis-header"><span class="diag-icon">🗺️</span><h3>未来30天行动路线图</h3></div>
      <div class="timeline">
        ${R.timeline.map((t, i) => `
          <div class="timeline-item">
            <div class="timeline-dot"></div>
            <div class="timeline-week">第${i+1}周</div>
            <div class="timeline-title">${t.title}</div>
            <div class="timeline-action">${t.action}</div>

      </div>
    </div>

    <!-- 模块七：治愈收尾 -->

      <h2>${R.ending.title}</h2>
      <p class="ending-line">${R.ending.line1}</p>
      <p class="ending-line"><em>${R.ending.line2}</em></p>
      <button class="btn-retry" onclick="restartTest()">🔄 重新诊断</button>
      <p class="disclaimer-small" style="margin-top:10px;">纯趣味测试，非科学评估 · 仅供娱乐</p>
    </div>
  `;
  
  document.getElementById('report-root').innerHTML = html;
  
  // 动画播放进度条
  setTimeout(() => {
    document.querySelectorAll('.dim-bar-fill[data-w]').forEach(b => {
      b.style.width = b.getAttribute('data-w') + '%';
    });
    document.querySelectorAll('.source-bar-fill[data-w]').forEach(b => {
      b.style.width = b.getAttribute('data-w') + '%';
    });
  }, 100);
}

function restartTest() {
  showScreen('splash');
}

// Toast
let toastTimer;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg; toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

initConfig();
</script>
