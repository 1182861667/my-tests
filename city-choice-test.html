<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>你更适合大城市拼，还是小城市躺？</title>
<meta name="description" content="25道题测出你的城市适配基因，看看你是都市野心家还是自然栖居者">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --primary: #6366F1;
  --primary-dark: #4F46E5;
  --bg-gradient: linear-gradient(135deg, #6366F1 0%, #14B8A6 100%);
  --card-bg: #ffffff;
  --text-primary: #1F2937;
  --text-secondary: #6B7280;
  --text-light: #9CA3AF;
  --shadow: 0 10px 40px rgba(0,0,0,0.12);
  --shadow-lg: 0 20px 60px rgba(0,0,0,0.15);
  --radius: 20px;
  --radius-sm: 12px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', sans-serif;
  background: var(--bg-gradient);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

#app {
  width: 100%;
  max-width: 420px;
  position: relative;
}

.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 32px 28px;
  box-shadow: var(--shadow-lg);
  text-align: center;
  animation: fadeSlideUp 0.5s ease;
  position: relative;
  overflow: hidden;
}

@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeSlideDown {
  from { opacity: 1; transform: translateY(0); }
  to { opacity: 0; transform: translateY(30px); }
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

@keyframes bounceIn {
  0% { transform: scale(0.3); opacity: 0; }
  50% { transform: scale(1.05); }
  70% { transform: scale(0.9); }
  100% { transform: scale(1); opacity: 1; }
}

.card::before {
  content: '';
  position: absolute;
  top: -60px; right: -60px;
  width: 140px; height: 140px;
  border-radius: 50%;
  background: var(--primary);
  opacity: 0.06;
  pointer-events: none;
}

.card::after {
  content: '';
  position: absolute;
  bottom: -40px; left: -40px;
  width: 100px; height: 100px;
  border-radius: 50%;
  background: var(--primary);
  opacity: 0.04;
  pointer-events: none;
}

.splash-emoji { font-size: 64px; margin-bottom: 16px; animation: bounceIn 0.8s ease; display: inline-block; }
.splash-title { font-size: 26px; font-weight: 800; color: var(--text-primary); margin-bottom: 8px; line-height: 1.3; position: relative; z-index: 1; }
.splash-subtitle { font-size: 14px; color: var(--text-secondary); margin-bottom: 4px; position: relative; z-index: 1; }
.splash-desc { font-size: 13px; color: var(--text-light); margin-bottom: 24px; line-height: 1.6; position: relative; z-index: 1; }
.divider { width: 40px; height: 3px; background: var(--primary); border-radius: 2px; margin: 0 auto 20px; opacity: 0.5; }
.btn-start { display: inline-block; padding: 14px 48px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; border: none; border-radius: 50px; font-size: 17px; font-weight: 700; cursor: pointer; transition: all var(--transition); position: relative; z-index: 1; box-shadow: 0 4px 20px rgba(99,102,241,0.35); letter-spacing: 1px; }
.btn-start:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(99,102,241,0.45); }
.btn-start:active { transform: scale(0.96); }
.disclaimer-small { font-size: 11px; color: var(--text-light); margin-top: 16px; position: relative; z-index: 1; opacity: 0.7; }
.question-count-tag { display: inline-block; padding: 4px 16px; background: rgba(99,102,241,0.08); color: var(--primary); border-radius: 20px; font-size: 12px; font-weight: 600; margin-bottom: 12px; }

.progress-wrap { width: 100%; height: 4px; background: #F3F4F6; border-radius: 2px; margin-bottom: 24px; overflow: hidden; position: relative; z-index: 1; }
.progress-bar { height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-dark)); border-radius: 2px; transition: width 0.4s ease; }

.question-counter { font-size: 12px; color: var(--primary); font-weight: 700; margin-bottom: 8px; position: relative; z-index: 1; }
.question-text { font-size: 20px; font-weight: 700; color: var(--text-primary); margin-bottom: 28px; line-height: 1.5; position: relative; z-index: 1; }
.options-list { display: flex; flex-direction: column; gap: 12px; position: relative; z-index: 1; }
.option-btn { display: block; width: 100%; padding: 16px 20px; background: #F9FAFB; border: 2px solid #E5E7EB; border-radius: var(--radius-sm); font-size: 15px; font-weight: 500; color: var(--text-primary); cursor: pointer; transition: all var(--transition); text-align: left; font-family: inherit; position: relative; }
.option-btn:hover { border-color: var(--primary); background: rgba(99,102,241,0.03); transform: translateX(4px); }
.option-btn:active { transform: scale(0.98); }
.option-btn.selected { border-color: var(--primary); background: rgba(99,102,241,0.06); color: var(--primary); font-weight: 600; }
.option-btn .option-letter { display: inline-block; width: 28px; height: 28px; line-height: 28px; text-align: center; background: #E5E7EB; border-radius: 50%; margin-right: 12px; font-size: 12px; font-weight: 700; color: var(--text-secondary); transition: all var(--transition); }
.option-btn.selected .option-letter { background: var(--primary); color: #fff; }

.btn-next { display: none; width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; border: none; border-radius: 50px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 24px; transition: all var(--transition); position: relative; z-index: 1; box-shadow: 0 4px 16px rgba(99,102,241,0.3); }
.btn-next.visible { display: block; animation: fadeSlideUp 0.3s ease; }
.btn-next:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(99,102,241,0.4); }
.btn-next:active { transform: scale(0.96); }

.result-emoji { font-size: 72px; margin-bottom: 12px; animation: bounceIn 0.6s ease; }
.result-type-badge { display: inline-block; padding: 6px 20px; border-radius: 50px; font-size: 13px; font-weight: 700; margin-bottom: 8px; }
.result-title { font-size: 24px; font-weight: 800; color: var(--text-primary); margin-bottom: 16px; position: relative; z-index: 1; }
.result-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.8; margin-bottom: 20px; text-align: left; position: relative; z-index: 1; }
.result-advice { text-align: left; background: rgba(99,102,241,0.04); border-radius: var(--radius-sm); padding: 16px 20px; margin-bottom: 24px; position: relative; z-index: 1; border-left: 3px solid var(--primary); }
.result-advice-title { font-size: 13px; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
.result-advice ul { list-style: none; padding: 0; }
.result-advice li { font-size: 13px; color: var(--text-secondary); padding: 4px 0; padding-left: 16px; position: relative; }
.result-advice li::before { content: '•'; position: absolute; left: 0; color: var(--primary); font-weight: 700; }
.result-actions { display: flex; gap: 10px; position: relative; z-index: 1; }
.btn-retry, .btn-share { flex: 1; padding: 13px; border-radius: 50px; font-size: 14px; font-weight: 700; cursor: pointer; transition: all var(--transition); border: none; font-family: inherit; letter-spacing: 0.5px; }
.btn-retry { background: #F3F4F6; color: var(--text-secondary); }
.btn-retry:hover { background: #E5E7EB; }
.btn-share { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; box-shadow: 0 4px 16px rgba(99,102,241,0.3); }
.btn-share:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(99,102,241,0.4); }
.btn-share:active, .btn-retry:active { transform: scale(0.96); }

.toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-120px); background: #1F2937; color: #fff; padding: 12px 24px; border-radius: 50px; font-size: 14px; font-weight: 600; z-index: 999; transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 8px 30px rgba(0,0,0,0.2); }
.toast.show { transform: translateX(-50%) translateY(0); }

.calculating { text-align: center; padding: 40px 20px; position: relative; z-index: 1; }
.calc-emoji { font-size: 48px; animation: pulse 1s infinite; }
.calc-text { font-size: 15px; color: var(--text-secondary); margin-top: 16px; }
.calc-dots { display: flex; gap: 6px; justify-content: center; margin-top: 12px; }
.calc-dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); animation: pulse 1.2s infinite; opacity: 0.3; }
.calc-dots span:nth-child(2) { animation-delay: 0.2s; }
.calc-dots span:nth-child(3) { animation-delay: 0.4s; }

.screen { display: none; }
.screen.active { display: block; }

@media (max-width: 380px) {
  .card { padding: 24px 20px; }
  .splash-title { font-size: 22px; }
  .question-text { font-size: 18px; }
  .result-title { font-size: 20px; }
  .splash-emoji { font-size: 52px; }
  .result-emoji { font-size: 56px; }
}
@media (min-width: 768px) {
  .card { padding: 40px 36px; }
  .splash-title { font-size: 28px; }
}
</style>
</head>
<body>

<div id="app">
  <div id="screen-splash" class="screen active">
    <div class="card">
      <div class="splash-emoji" id="splashEmoji">🌆</div>
      <h1 class="splash-title" id="splashTitle">你更适合大城市拼，还是小城市躺？</h1>
      <p class="splash-subtitle" id="splashSubtitle">25道题，测出你的城市适配基因</p>
      <div class="divider"></div>
      <p class="splash-desc" id="splashDesc">大城市的机会和小城市的松弛，哪个才是你的灵魂归宿？25道题，测出你的城市适配基因，看看你该在哪片土壤生根发芽。</p>
      <div class="question-count-tag" id="questionCountTag"></div>
      <br>
      <button class="btn-start" onclick="startTest()">✨ 开始测试</button>
      <p class="disclaimer-small">纯趣味测试，非科学评估 · 仅供娱乐</p>
    </div>
  </div>

  <div id="screen-question" class="screen">
    <div class="card">
      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="question-counter" id="questionCounter">1 / 25</div>

      <div class="options-list" id="optionsList"></div>

    </div>
  </div>

  <div id="screen-calculating" class="screen">
    <div class="card">
      <div class="calculating">
        <div class="calc-emoji">🔮</div>
        <p class="calc-text">正在生成你的专属答案…</p>
        <div class="calc-dots">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </div>

  <div id="screen-result" class="screen">
    <div class="card">
      <div class="result-emoji" id="resultEmoji"></div>
      <div class="result-type-badge" id="resultBadge"></div>
      <h2 class="result-title" id="resultTitle"></h2>
      <div class="divider"></div>
      <p class="result-desc" id="resultDesc"></p>
      <div class="result-advice" id="resultAdvice">
        <div class="result-advice-title">💡 给你的建议</div>
        <ul id="resultAdviceList"></ul>
      </div>
      <div class="result-actions">
        <button class="btn-retry" onclick="restartTest()">🔄 重新测试</button>
        <button class="btn-share" onclick="shareResult()">📤 分享结果</button>
      </div>
      <p class="disclaimer-small" style="margin-top:12px;">纯趣味测试，非科学评估 · 仅供娱乐</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

let currentQuestion = 0;
let scores = [];

function initConfig() {
  const cfg = TEST_CONFIG;
  document.title = cfg.title;
  document.querySelector('meta[name="description"]').content = cfg.description || cfg.title;
  const root = document.documentElement;
  root.style.setProperty('--primary', cfg.themeColor);
  root.style.setProperty('--primary-dark', adjustColor(cfg.themeColor, -15));
  root.style.setProperty('--bg-gradient', `linear-gradient(135deg, ${cfg.themeColor} 0%, ${cfg.accentColor} 100%)`);
  document.getElementById('splashEmoji').textContent = cfg.emoji || '🧠';
  document.getElementById('splashTitle').textContent = cfg.title;
  document.getElementById('splashSubtitle').textContent = cfg.subtitle || '';
  document.getElementById('splashDesc').textContent = cfg.description || '';
  document.getElementById('questionCountTag').textContent = `共 ${cfg.questions.length} 题 · 约1分钟`;
}

function adjustColor(hex, amount) {
  const num = parseInt(hex.replace('#', ''), 16);
  const r = Math.max(0, Math.min(255, ((num >> 16) & 0xFF) + amount));
  const g = Math.max(0, Math.min(255, ((num >> 8) & 0xFF) + amount));
  const b = Math.max(0, Math.min(255, (num & 0xFF) + amount));
  return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, '0')}`;
}

function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + screenId).classList.add('active');
}

function startTest() {
  currentQuestion = 0;
  scores = [];
  showScreen('question');
  renderQuestion();
}

function renderQuestion() {
  const cfg = TEST_CONFIG;
  const q = cfg.questions[currentQuestion];
  const total = cfg.questions.length;
  document.getElementById('progressBar').style.width = ((currentQuestion) / total * 100) + '%';
  document.getElementById('questionCounter').textContent = `${currentQuestion + 1} / ${total}`;
  document.getElementById('questionText').textContent = q.text;
  const optionsHtml = q.options.map((opt, i) => {
    const letter = String.fromCharCode(65 + i);
    return `<button class="option-btn" onclick="selectOption(${i}, this)" data-index="${i}"><span class="option-letter">${letter}</span>${opt.text}</button>`;
  }).join('');
  document.getElementById('optionsList').innerHTML = optionsHtml;
  document.getElementById('btnNext').classList.remove('visible');
  const card = document.querySelector('#screen-question .card');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'fadeSlideUp 0.4s ease';
}

function selectOption(index, btn) {
  const cfg = TEST_CONFIG;
  const q = cfg.questions[currentQuestion];
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  scores[currentQuestion] = q.options[index].score;
  const nextBtn = document.getElementById('btnNext');
  nextBtn.classList.add('visible');
  nextBtn.textContent = currentQuestion < cfg.questions.length - 1 ? '下一题 →' : '查看结果 ✨';
}

function nextQuestion() {
  const cfg = TEST_CONFIG;
  if (scores[currentQuestion] === undefined) {
    showToast('请先选择一个选项哦~');
    return;
  }
  currentQuestion++;
  if (currentQuestion < cfg.questions.length) {
    renderQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  const cfg = TEST_CONFIG;
  const totalScore = scores.reduce((a, b) => a + b, 0);
  let matchedResult = cfg.results[0];
  for (const r of cfg.results) {
    if (totalScore >= r.range[0] && totalScore <= r.range[1]) {
      matchedResult = r;
      break;
    }
  }
  showScreen('calculating');
  setTimeout(() => {
    showScreen('result');
    document.getElementById('resultEmoji').textContent = matchedResult.emoji || '🎯';
    document.getElementById('resultBadge').textContent = matchedResult.title;
    document.getElementById('resultBadge').style.background = (matchedResult.color || cfg.themeColor) + '18';
    document.getElementById('resultBadge').style.color = matchedResult.color || cfg.themeColor;
    document.getElementById('resultTitle').textContent = matchedResult.title;
    document.getElementById('resultDesc').textContent = matchedResult.description || '';
    const adviceList = document.getElementById('resultAdviceList');
    if (matchedResult.advice && matchedResult.advice.length > 0) {
      adviceList.innerHTML = matchedResult.advice.map(a => `<li>${a}</li>`).join('');
      document.getElementById('resultAdvice').style.display = 'block';
    } else {
      document.getElementById('resultAdvice').style.display = 'none';
    }
  }, 1500);
}

function restartTest() {
  showScreen('splash');
}

function shareResult() {
  const text = TEST_CONFIG.shareText || `我刚测了「${TEST_CONFIG.title}」，来看看你是什么类型？`;
  const url = window.location.href;
  if (navigator.share) {
    navigator.share({ title: TEST_CONFIG.title, text: text, url: url }).catch(() => {
      copyToClipboard(text + '\n' + url);
    });
  } else {
    copyToClipboard(text + '\n' + url);
  }
}

function copyToClipboard(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      showToast('已复制分享文案和链接 ✅');
    }).catch(() => { fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  ta.style.top = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    document.execCommand('copy');
    showToast('已复制分享文案和链接 ✅');
  } catch (e) {
    showToast('复制失败，请手动复制页面链接');
  }
  document.body.removeChild(ta);
}

let toastTimer;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 2000);
}

initConfig();
</script>
